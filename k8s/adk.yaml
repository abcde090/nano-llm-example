# ADK multi-agent API on the same cluster, talking to the Ollama service
# in-namespace. Deployed by `make adk-deploy` AFTER `make adk-build` has
# pushed the image — deliberately not part of the Cloud Deploy manifest set,
# since the image only exists once you build it.
#
# Template variables: ${PROJECT_ID}, ${REGION}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nano-team-adk
  namespace: nano-llm
  labels:
    app: nano-team-adk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nano-team-adk
  template:
    metadata:
      labels:
        app: nano-team-adk
    spec:
      containers:
        - name: adk
          image: ${REGION}-docker.pkg.dev/${PROJECT_ID}/apps/nano-team-adk:latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: OLLAMA_API_BASE
              value: http://ollama:11434/v1
            - name: NANO_LLM_MODEL
              value: qwen2.5:0.5b
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
              ephemeral-storage: 1Gi
            limits:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 1Gi
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: nano-team-adk
  namespace: nano-llm
  labels:
    app: nano-team-adk
spec:
  type: ClusterIP
  selector:
    app: nano-team-adk
  ports:
    - name: http
      port: 8000
      targetPort: http
