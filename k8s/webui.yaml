# Open WebUI — a self-hosted, ChatGPT-style web interface that talks to the
# Ollama service. No template variables; the image comes from ghcr.io, which
# nodes reach through Cloud NAT (the Artifact Registry remote repo only
# proxies Docker Hub).
#
# Access is via `make webui` (port-forward) — the public Gateway deliberately
# routes only /v1, so the UI is never internet-exposed. On first visit you
# create an account; the first account becomes the admin.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: nano-llm
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard-rwo
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: nano-llm
  labels:
    app: open-webui
spec:
  replicas: 1
  # Recreate: chat-history PVC is ReadWriteOnce.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      containers:
        - name: open-webui
          # Pin and bump deliberately; 'latest'/'main' are rolling tags.
          image: ghcr.io/open-webui/open-webui:v0.6.5
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: OLLAMA_BASE_URL
              value: http://ollama:11434
            - name: ENABLE_OPENAI_API
              value: "false" # only the local Ollama backend, no OpenAI key prompts
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
              ephemeral-storage: 2Gi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: nano-llm
  labels:
    app: open-webui
spec:
  type: ClusterIP
  selector:
    app: open-webui
  ports:
    - name: http
      port: 8080
      targetPort: http
