<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Codelabs Chat</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; display: flex; flex-direction: column; height: 100vh;
         background: light-dark(#f6f7f9, #101418); color: light-dark(#1a1c1f, #e6e8ea); }
  header { padding: 12px 20px; display: flex; gap: 12px; align-items: center;
           border-bottom: 1px solid light-dark(#dde1e6, #2a2f36); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  select { padding: 6px 10px; border-radius: 8px; border: 1px solid light-dark(#c6ccd4, #3a414b);
           background: inherit; color: inherit; }
  #log { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 70ch; padding: 10px 14px; border-radius: 12px; line-height: 1.45;
         white-space: pre-wrap; word-wrap: break-word; }
  .user { align-self: flex-end; background: light-dark(#d7e6ff, #1d3a5f); }
  .bot  { align-self: flex-start; background: light-dark(#ffffff, #1b2027);
          border: 1px solid light-dark(#e3e7ec, #2a2f36); }
  .tools { align-self: flex-start; font-size: 12px; opacity: .65; }
  form { display: flex; gap: 8px; padding: 14px 20px;
         border-top: 1px solid light-dark(#dde1e6, #2a2f36); }
  input { flex: 1; padding: 10px 14px; border-radius: 10px;
          border: 1px solid light-dark(#c6ccd4, #3a414b); background: inherit; color: inherit; }
  button { padding: 10px 18px; border-radius: 10px; border: 0; background: #2563eb;
           color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; }
</style>
</head>
<body>
<header>
  <h1>Agent Codelabs</h1>
  <select id="app" title="agent"></select>
</header>
<div id="log"></div>
<form id="form">
  <input id="input" placeholder="Ask the agent…" autocomplete="off" autofocus>
  <button id="send">Send</button>
</form>
<script>
const log = document.getElementById('log');
const form = document.getElementById('form');
const input = document.getElementById('input');
const send = document.getElementById('send');
const appSel = document.getElementById('app');
let sessionId = null;

function add(cls, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + cls;
  div.textContent = text;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
  return div;
}

fetch('/api/apps').then(r => r.json()).then(apps => {
  for (const a of apps) appSel.add(new Option(a, a));
});

appSel.onchange = () => { sessionId = null; add('tools', '— new session with ' + appSel.value + ' —'); };

form.onsubmit = async (e) => {
  e.preventDefault();
  const message = input.value.trim();
  if (!message) return;
  add('user', message);
  input.value = '';
  send.disabled = true;
  const thinking = add('bot', '…');
  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({app_name: appSel.value, message, session_id: sessionId}),
    });
    const data = await resp.json();
    sessionId = data.session_id;
    thinking.textContent = data.reply;
    if (data.tool_calls?.length) add('tools', '⚙ tools used: ' + data.tool_calls.join(', '));
  } catch (err) {
    thinking.textContent = 'error: ' + err;
  } finally {
    send.disabled = false;
    input.focus();
  }
};
</script>
</body>
</html>
